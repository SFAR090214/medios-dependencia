name: sync-medios
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar CSV publicado de la hoja de Google
        run: |
          curl -fsSL "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1911ZQMJnVToPJdrCtm0migIbIeOxm_tFHftiGvbNn0rMtmLz2DqmHvETovvY2ROp53zJlHKhb4GR/pub?output=csv" -o medios.csv
      - name: Commit si hay cambios
        run: |
          if ! git diff --quiet -- medios.csv; then
            git config user.name "medios-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add medios.csv
            git commit -m "sync medios $(date -u +%F' '%T) UTC"
            git push
          else
            echo "Sin cambios en medios.csv"
          fi
